<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>블록 블라스트</title>
<style>
:root{--bg:#141a4a;--bg2:#0b0f2e;--cell:#1f2868;--txt:#fff;--bw:min(94vw,440px);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(circle at 50% 0,var(--bg),var(--bg2));color:var(--txt);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;touch-action:none;overflow:hidden}
#wrap{width:var(--bw);display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0}
#hud{width:100%;display:flex;justify-content:space-between;align-items:flex-end}
.lb{font-size:12px;opacity:.7}.big{font-size:34px;font-weight:800;line-height:1}
#board{width:var(--bw);aspect-ratio:1;background:#0d1140;border-radius:12px;padding:4px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:0 0 0 2px #2a3490,0 10px 30px #0008}
.c{background:var(--cell);border-radius:4px}
.f{box-shadow:inset 3px 3px 0 #ffffff59,inset -3px -3px 0 #00000040}
.ph{opacity:.45}
.clr{animation:pop .28s forwards}
@keyframes pop{50%{filter:brightness(2.2);transform:scale(1.1)}to{transform:scale(0);opacity:0}}
#tray{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{height:calc(var(--p)*2.1);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.pg{display:grid;gap:2px}
.pg div{border-radius:3px}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:9;display:grid;gap:2px}
#ghost div{border-radius:4px}
#ov{position:fixed;inset:0;background:#000b;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20}
#ov.on{display:flex}
#ov h2{font-size:36px;margin:0}
button{font:inherit;font-weight:700;font-size:18px;padding:12px 32px;border:0;border-radius:999px;background:#fbc02d;color:#222;cursor:pointer}
.toast{position:fixed;left:50%;top:32%;font-size:40px;font-weight:900;white-space:nowrap;color:#ffd54f;text-shadow:0 3px 0 #b71c1c,0 0 20px #ff9800;pointer-events:none;z-index:15;animation:rise .9s forwards}
@keyframes rise{from{opacity:0;transform:translate(-50%,20px) scale(.5)}20%{opacity:1;transform:translate(-50%,0) scale(1.2)}to{opacity:0;transform:translate(-50%,-60px) scale(1)}}
#board.shake{animation:sh .35s}
@keyframes sh{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,2px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:12}
h1{margin:0;font-size:26px;font-weight:900;background:linear-gradient(90deg,#ffd54f,#ff7043);-webkit-background-clip:text;background-clip:text;color:transparent}
.sm{font-size:13px;padding:6px 12px;background:#ffffff22;color:#fff;margin:2px}.sec{background:#ffffff33;color:#fff}
.ov2{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:30;padding:20px}.ov2.on{display:flex}
input{font:inherit;font-size:18px;padding:12px 16px;border-radius:10px;border:2px solid #2a3490;background:#0d1140;color:#fff;width:min(80vw,300px);-webkit-user-select:text;user-select:text}
#rl{width:min(90vw,380px);max-height:55vh;overflow:auto;touch-action:pan-y}
.row{display:flex;gap:10px;padding:8px 10px;border-radius:8px;background:#ffffff14;margin-bottom:6px}.row.me{background:#fbc02d40}.row b{width:30px}.row span{flex:1}
.rb{animation:rb .7s linear infinite}.ph.rb{opacity:1}
@keyframes rb{0%,100%{background-color:#ff1744}17%{background-color:#ff9100}33%{background-color:#ffea00}50%{background-color:#00e676}67%{background-color:#2979ff}83%{background-color:#d500f9}}
</style>
</head>
<body>
<div id="wrap">
  <h1>🧱 제일고 블럭깨기</h1>
  <div id="hud">
    <div><div class="lb">점수</div><div class="big" id="sc">0</div></div>
    <div style="text-align:center"><button class="sm" id="rbtn">🏆 랭킹</button></div>
    <div style="text-align:right"><div class="lb">최고 점수</div><div class="big" id="bs" style="font-size:22px">0</div></div>
  </div>
  <div id="board"></div>
  <div id="tray"></div>
</div>
<canvas id="fx"></canvas>
<div id="ov"><h2 style="margin:0">게임 오버</h2><div>점수 <b id="fs">0</b></div><div class="lb">학번과 이름을 입력하고 기록을 저장하세요</div><input id="sid" placeholder="학번" maxlength="10" inputmode="numeric"><input id="snm" placeholder="이름" maxlength="10"><div id="perr" class="lb" style="color:#ff8a80;min-height:1em"></div><button id="sv">기록 저장</button><button id="rk2" class="sec">🏆 랭킹 보기</button><button id="rs" class="sec">다시 하기</button></div>
<div id="rk" class="ov2"><h2 style="margin:0">🏆 랭킹</h2><div id="rnote" class="lb"></div><div id="rl"></div><button id="rkx">닫기</button></div>
<script>
const N=8,COLORS=['#e53935','#fbc02d','#43a047','#1e88e5','#8e24aa','#fb8c00','#00acc1'];
const S=["X","XX","XXX","XXXX","XXXXX","X/X","X/X/X","X/X/X/X","X/X/X/X/X","XX/XX","XXX/XXX/XXX","XX/X.","XX/.X","X./XX",".X/XX","XXX/X..","XXX/..X","X../XXX","..X/XXX","X../X../XXX","XXX/X../X..","XXX/..X/..X","..X/..X/XXX","XXX/.X.",".X./XXX","X./XX/X.",".X/XX/.X","XX./.XX",".XX/XX.","XXX/XXX","XX/XX/XX"]
.map(s=>{const rows=s.split('/'),cells=[];rows.forEach((r,i)=>[...r].forEach((ch,j)=>ch=='X'&&cells.push([i,j])));return{cells,h:rows.length,w:rows[0].length}});
const $=s=>document.querySelector(s),boardEl=$('#board'),trayEl=$('#tray');
let grid,pieces,score,best=0,combo,drag=null,busy=false,P=40;
try{best=+localStorage.getItem('bb-best')||0}catch(e){}
const cellEls=[];
for(let i=0;i<64;i++){const d=document.createElement('div');d.className='c';boardEl.appendChild(d);cellEls.push(d)}
for(let i=0;i<3;i++){const s=document.createElement('div');s.className='slot';s.onpointerdown=e=>start(e,i);trayEl.appendChild(s)}
function size(){P=(boardEl.clientWidth-8)/N;document.documentElement.style.setProperty('--p',P+'px');render()}
function rnd(){let sh=S[Math.random()*S.length|0];if(sh.cells.length>=5&&Math.random()<.5)sh=S[Math.random()*S.length|0];return{...sh,color:Math.random()*COLORS.length|0}}
function cnt(p){let n=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(p,r,c))n++;return n}
function deal(){let best=null,bs=-1;for(let t=0;t<50;t++){const ps=[rnd(),rnd(),rnd()],cs=ps.map(cnt),sc=cs.reduce((a,c)=>a+Math.min(c,6),0);
  if(cs.every(c=>c>=3))return ps;if(sc>bs){bs=sc;best=ps}}return best}
function dealAfter(kill){const g0=grid;grid=grid.slice();kill.forEach(k=>grid[k]=-1);const r=deal();grid=g0;return r}
function newGame(){grid=Array(64).fill(-1);score=0;combo=0;busy=false;pieces=deal();$('#ov').classList.remove('on');resetOv();render()}
function render(){
  cellEls.forEach((d,i)=>{d.className='c';d.style.background='';if(grid[i]>=0){d.className='c f';d.style.background=COLORS[grid[i]]}});
  [...trayEl.children].forEach((slot,i)=>{slot.innerHTML='';slot.style.opacity=1;const p=pieces[i];if(!p)return;
    const t=P*.55,g=document.createElement('div');g.className='pg';g.style.gridTemplateColumns=`repeat(${p.w},${t}px)`;g.style.gridAutoRows=t+'px';
    fill(g,p);slot.appendChild(g)});
  $('#sc').textContent=score;$('#bs').textContent=best;
}
function fill(g,p){for(let r=0;r<p.h;r++)for(let c=0;c<p.w;c++){const d=document.createElement('div');
  if(p.cells.some(x=>x[0]==r&&x[1]==c)){d.className='f';d.style.background=COLORS[p.color]}g.appendChild(d)}}
function fits(p,r,c){return p.cells.every(([a,b])=>{const y=r+a,x=c+b;return y>=0&&y<N&&x>=0&&x<N&&grid[y*N+x]<0})}
function start(e,i){
  if(busy||!pieces[i])return;e.preventDefault();
  const p=pieces[i],g=document.createElement('div');g.id='ghost';
  g.style.gridTemplateColumns=`repeat(${p.w},${P-2}px)`;g.style.gridAutoRows=(P-2)+'px';fill(g,p);document.body.appendChild(g);
  drag={i,p,g,r:0,c:0,ok:false};trayEl.children[i].style.opacity=.25;move(e);
}
function move(e){
  if(!drag)return;const{p,g}=drag,gw=p.w*P,gh=p.h*P;
  const gx=e.clientX-gw/2,gy=e.clientY-gh-55;
  g.style.transform=`translate(${gx}px,${gy}px)`;
  const rc=boardEl.getBoundingClientRect();
  drag.c=Math.round((gx-rc.left-4)/P);drag.r=Math.round((gy-rc.top-4)/P);
  cellEls.forEach(d=>{d.classList.remove('rb');d.style.animationDelay=''});
  cellEls.forEach((d,i)=>{if(d.classList.contains('ph')){d.classList.remove('ph');if(grid[i]<0){d.style.background='';d.classList.remove('f')}}});
  drag.ok=fits(p,drag.r,drag.c);
  if(drag.ok)p.cells.forEach(([a,b])=>{const d=cellEls[(drag.r+a)*N+drag.c+b];d.classList.add('ph','f');d.style.background=COLORS[p.color]});
  if(drag.ok){const pv=new Set(p.cells.map(([a,b])=>(drag.r+a)*N+drag.c+b)),F=k=>grid[k]>=0||pv.has(k),hit=new Set();
    for(let k=0;k<N;k++){
      if([...Array(N)].every((_,x)=>F(k*N+x)))for(let x=0;x<N;x++)hit.add(k*N+x);
      if([...Array(N)].every((_,y)=>F(y*N+k)))for(let y=0;y<N;y++)hit.add(y*N+k)}
    hit.forEach(k=>{cellEls[k].classList.add('rb');cellEls[k].style.animationDelay=-((k%N)+(k/N|0))*.08+'s'})}
}
window.addEventListener('pointermove',move);
window.addEventListener('pointerup',()=>{
  if(!drag)return;const{i,p,g,r,c,ok}=drag;g.remove();drag=null;
  if(ok)place(i,p,r,c);else render();
});
function place(i,p,r,c){
  p.cells.forEach(([a,b])=>grid[(r+a)*N+c+b]=p.color);score+=p.cells.length;pieces[i]=null;
  const kill=new Set();let lines=0;
  for(let k=0;k<N;k++){
    if([...Array(N)].every((_,x)=>grid[k*N+x]>=0)){lines++;for(let x=0;x<N;x++)kill.add(k*N+x)}
    if([...Array(N)].every((_,y)=>grid[y*N+k]>=0)){lines++;for(let y=0;y<N;y++)kill.add(y*N+k)}
  }
  if(!pieces.some(x=>x))pieces=dealAfter(kill);
  if(lines){combo++;score+=lines*lines*10+(combo-1)*10;busy=true;render();
    kill.forEach(k=>cellEls[k].classList.add('clr'));celebrate(kill,lines);
    setTimeout(()=>{kill.forEach(k=>grid[k]=-1);busy=false;render();check()},280);
  }else{combo=0;render();check()}
  if(score>best)best=score;
}
function check(){
  const alive=pieces.some(p=>p&&(()=>{for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(fits(p,r,c))return true;return false})());
  if(!alive){$('#fs').textContent=score;$('#ov').classList.add('on')}
}

const cv=$('#fx'),ctx=cv.getContext('2d');let parts=[],raf=0;
function fxSize(){cv.width=innerWidth;cv.height=innerHeight}fxSize();
function burst(k){const rc=cellEls[k].getBoundingClientRect(),x=rc.left+rc.width/2,y=rc.top+rc.height/2,col=COLORS[grid[k]];
  for(let n=0;n<12;n++){const a=Math.random()*6.28,v=2+Math.random()*5;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,sz:3+Math.random()*5,col})}
  for(let n=0;n<2;n++){const a=Math.random()*6.28,v=3+Math.random()*8;parts.push({img:1,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,l:1.3,sz:22+Math.random()*30,rot:Math.random()*6,vr:(Math.random()-.5)*.4})}
  if(!raf)raf=requestAnimationFrame(loop)}
function loop(){ctx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.l-=p.img?.016:.022;ctx.globalAlpha=Math.min(Math.max(p.l,0),1);
    if(p.img){p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);const h=p.sz*LOGO.height/LOGO.width;ctx.drawImage(LOGO,-p.sz/2,-h/2,p.sz,h);ctx.restore()}
    else{ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.sz,p.sz)}});
  raf=parts.length?requestAnimationFrame(loop):0;if(!raf)ctx.clearRect(0,0,cv.width,cv.height)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
function celebrate(kill,lines){kill.forEach(burst);
  toast((['','좋아요!','멋져요!','대단해요!','놀라워요!'][Math.min(lines,4)])+(combo>1?' 콤보 x'+combo:''));
  if(lines>=2){boardEl.classList.remove('shake');void boardEl.offsetWidth;boardEl.classList.add('shake')}}
$('#rs').onclick=newGame;window.addEventListener('resize',()=>{size();fxSize()});
let player=null,DB=null,rows=[];
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

function setBest(){best=Object.values(lsGet('bb-local',{})).reduce((m,r)=>Math.max(m,r.score),0);$('#bs').textContent=best}
let saved=false;
function resetOv(){saved=false;['#sid','#snm'].forEach(q=>{$(q).value='';$(q).disabled=false});$('#perr').textContent='';$('#sv').textContent='기록 저장'}
$('#sv').onclick=async()=>{if(saved)return;const id=$('#sid').value.trim(),nm=$('#snm').value.trim();
  if(!id||!nm){$('#perr').textContent='학번과 이름을 모두 입력해 주세요';return}
  saved=true;player={id,name:nm};['#sid','#snm'].forEach(q=>$(q).disabled=true);$('#sv').textContent='저장됨 ✓';
  await submit(score);setBest();showRank()};
const did=id=>[...id].map(c=>/[A-Za-z0-9]/.test(c)?c:'_'+c.charCodeAt(0).toString(16)).join('').slice(0,60);
async function submit(sc){if(!player)return;
  const l=lsGet('bb-local',{}),o=l[player.id];
  if(!o||sc>o.score){l[player.id]={id:player.id,name:player.name,score:sc};lsSet('bb-local',l)}
  if(DB){try{const ref=DB.doc('scores/'+did(player.id)),sn=await ref.get(),d=sn.exists?sn.data():null;
    if(!d||sc>d.score)await ref.set({id:player.id,name:player.name,score:sc,t:Date.now()})}catch(e){}}}
function showRank(){
  const list=DB?rows:Object.values(lsGet('bb-local',{})).sort((a,b)=>b.score-a.score).slice(0,30);
  $('#rnote').textContent=DB?'전체 랭킹 (실시간)':'이 기기 기준 랭킹';
  const box=$('#rl');box.innerHTML='';
  if(!list.length){box.textContent='아직 기록이 없어요';}
  list.forEach((r,i)=>{const d=document.createElement('div');d.className='row'+(player&&r.id===player.id?' me':'');
    [['b',i+1],['span',r.id+' '+r.name],['b',r.score]].forEach(([t,v])=>{const e=document.createElement(t);e.textContent=v;d.appendChild(e)});
    d.lastChild.style.width='60px';d.lastChild.style.textAlign='right';box.appendChild(d)});
  $('#rk').classList.add('on')}
$('#rbtn').onclick=$('#rk2').onclick=showRank;$('#rkx').onclick=()=>$('#rk').classList.remove('on');
(async()=>{try{if(window.claude&&claude.use){DB=await claude.use('db');
  if(DB)DB.collection('scores').orderBy('score','desc').limit(30).onSnapshot(sn=>{rows=sn.docs.map(d=>d.data());if($('#rk').classList.contains('on'))showRank()},()=>{})}}catch(e){DB=null}})();
setBest();newGame();size();
</script>
